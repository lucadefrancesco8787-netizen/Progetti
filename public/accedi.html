<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accedi — Zeta Club</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>try { if (sessionStorage.getItem('zc-portal')) { sessionStorage.removeItem('zc-portal'); document.documentElement.classList.add('from-portal'); } } catch (e) {}</script>
</head>
<body class="auth-page">
<main class="auth">
  <section class="auth__visual on-dark" aria-hidden="true">
    <img src="/img/originali/news2.jpg" alt="">
    <a href="/" class="logo auth__logo"><svg viewBox="0 0 48 64"><use href="#zmark"/></svg><span class="logo__text"><span class="logo__name">ZETA<b>CLUB</b></span><span class="logo__tag">gym culture</span></span></a>
    <div class="auth__claim">
      <span class="eyebrow">Area riservata</span>
      <p class="display">Bentornato<br>nel <span class="grad-text">club.</span></p>
    </div>
  </section>

  <section class="auth__panel">
    <a href="/" class="auth__back">← Torna al sito</a>
    <div class="auth__box">
      <div class="auth__tabs" role="tablist" aria-label="Tipo di accesso">
        <button role="tab" aria-selected="true" data-tab="cliente">Sono un cliente</button>
        <button role="tab" aria-selected="false" data-tab="staff">Staff del club</button>
      </div>
      <h1 class="auth__title" id="authTitle">Accedi alla tua area</h1>
      <p class="auth__sub" id="authSub">Controlla i tuoi appuntamenti: Visbody, visite mediche, consulenze e personal training.</p>

      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field" style="margin-top:14px">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw__toggle" id="pwToggle" aria-label="Mostra password">Mostra</button>
          </div>
        </div>
        <button class="btn auth__submit" type="submit" id="loginBtn">Accedi <span class="arrow">→</span></button>
        <p class="form__msg" id="loginMsg" role="alert" aria-live="assertive"></p>
      </form>

      <div class="demo">
        <p class="demo__title">Account dimostrativi <span>clicca per compilare</span></p>
        <div class="demo__list" id="demoList">
          <button type="button" data-tab="cliente" data-email="cliente@demo.it" data-pw="Cliente2026!"><b>Cliente</b><span>cliente@demo.it</span></button>
          <button type="button" data-tab="staff" data-email="reception@demo.it" data-pw="Reception2026!"><b>Reception</b><span>reception@demo.it</span></button>
          <button type="button" data-tab="staff" data-email="consulente@demo.it" data-pw="Consulente2026!"><b>Consulente</b><span>consulente@demo.it</span></button>
          <button type="button" data-tab="staff" data-email="trainer@demo.it" data-pw="Trainer2026!"><b>Personal Trainer</b><span>trainer@demo.it</span></button>
          <button type="button" data-tab="staff" data-email="istruttore@demo.it" data-pw="Istruttore2026!"><b>Istruttore corsi</b><span>istruttore@demo.it</span></button>
        </div>
      </div>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="zg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b3ac"/><stop offset="1" stop-color="#3fc26b"/></linearGradient>
    <linearGradient id="zg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc26b"/><stop offset="1" stop-color="#d6e33b"/></linearGradient>
  </defs>
  <symbol id="zmark" viewBox="0 0 48 64">
    <path d="M24 0 L46 28 L30 28 L24 20 L10 28 L2 28 Z" fill="url(#zg1)"/>
    <path d="M18 24 L24 20 L30 28 Z" fill="#0f5f5b" opacity=".55"/>
    <path d="M2 36 L18 36 L24 44 L38 36 L46 36 L24 64 Z" fill="url(#zg2)"/>
    <path d="M18 36 L24 44 L30 40 Z" fill="#6b8f1f" opacity=".45"/>
  </symbol>
</svg>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/js/accedi.js"></script>
</body>
</html>
