<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La mia area — Zeta Club</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="area-page">

<header class="dash-top on-dark">
  <div class="wrap dash-top__inner">
    <a href="/" class="logo" aria-label="Zeta Club, vai al sito">
      <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#zmark"/></svg>
      <span class="logo__text"><span class="logo__name">ZETA<b>CLUB</b></span><span class="logo__tag">gym culture</span></span>
    </a>
    <div class="dash-user">
      <span class="dash-user__avatar" id="avatar" aria-hidden="true"></span>
      <span class="dash-user__txt"><strong id="userName">…</strong><small id="userRole"></small></span>
      <button class="btn btn--ghost dash-logout" id="logout" type="button">Esci</button>
    </div>
  </div>
</header>

<main class="dash">
  <section class="dash-hero on-dark">
    <div class="wrap">
      <span class="eyebrow" id="today"></span>
      <h1 class="display dash-hero__title" id="hello">Ciao.</h1>
      <p class="dash-hero__sub" id="heroSub"></p>
      <div class="kpis" id="kpis"></div>
    </div>
  </section>
  <div class="wrap dash-body" id="dashBody" aria-live="polite">
    <p class="empty">Caricamento…</p>
  </div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="zg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b3ac"/><stop offset="1" stop-color="#3fc26b"/></linearGradient>
    <linearGradient id="zg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc26b"/><stop offset="1" stop-color="#d6e33b"/></linearGradient>
  </defs>
  <symbol id="zmark" viewBox="0 0 48 64">
    <path d="M24 0 L46 28 L30 28 L24 20 L10 28 L2 28 Z" fill="url(#zg1)"/>
    <path d="M18 24 L24 20 L30 28 Z" fill="#0f5f5b" opacity=".55"/>
    <path d="M2 36 L18 36 L24 44 L38 36 L46 36 L24 64 Z" fill="url(#zg2)"/>
    <path d="M18 36 L24 44 L30 40 Z" fill="#6b8f1f" opacity=".45"/>
  </symbol>
</svg>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/js/area.js"></script>
</body>
</html>
